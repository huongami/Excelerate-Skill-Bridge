  .t { font-size: 13px; fill: #343a40; }

  .m { font-size: 12px; fill: #6b7280; }

<body>
<svg width="1600" height="1060" viewBox="0 0 1600 1060" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6868f7"/></marker>
    <filter id="s" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0d131b" flood-opacity="0.08"/></filter>

  <text x="40" y="58" class="title">Jinder data platform — Bronze, Silver and Gold layers</text>
  <text x="40" y="86" class="sub">S3 data lake in Sydney · Apache Iceberg tables · Glue Data Catalog · access through Lake Formation · no personal data in Gold</text>

  <!-- ===== SOURCES ===== -->
  <rect x="40" y="120" width="260" height="600" rx="18" fill="#fff" stroke="#e9ecef" filter="url(#s)"/>
  <text x="62" y="150" class="tag" style="fill:#6868f7">SOURCES</text>

  <image href="icons/aws/AmazonRDS.svg" x="62" y="172" width="44" height="44"/>
  <text x="118" y="190" class="tb">RDS PostgreSQL</text>
  <text x="118" y="208" class="m">all app tables</text>
  <image href="icons/aws/AWSDatabaseMigrationService.svg" x="118" y="220" width="26" height="26"/>
  <text x="150" y="238" class="m">nightly export → DMS CDC</text>

  <image href="icons/aws/AmazonDataFirehose.svg" x="62" y="290" width="44" height="44"/>
  <text x="118" y="308" class="tb">App events</text>
  <text x="118" y="326" class="m">job_appear, job_watch,</text>
  <text x="118" y="342" class="m">profile_saved, … via Firehose</text>

  <image href="icons/aws/AmazonSimpleNotificationService.svg" x="62" y="390" width="44" height="44"/>
  <text x="118" y="408" class="tb">Email events</text>
  <text x="118" y="426" class="m">SES → SNS → Firehose</text>

  <image href="icons/aws/AWSFargate.svg" x="62" y="480" width="44" height="44"/>
  <text x="118" y="498" class="tb">Parse results</text>
  <text x="118" y="516" class="m">CV and JD JSON (worker)</text>
  <text x="118" y="532" class="m" style="fill:#800000">personal data</text>

  <image href="icons/aws/AmazonSimpleStorageService.svg" x="62" y="580" width="44" height="44"/>
  <text x="118" y="598" class="tb">Reference data</text>
  <text x="118" y="616" class="m">ict_taxonomy.json versions,</text>
  <text x="118" y="632" class="m">job catalogue files</text>

  <rect x="62" y="660" width="216" height="44" rx="10" fill="#ffd2e1"/>
  <text x="76" y="680" class="t" style="fill:#800000;font-weight:600">Original CV files are never</text>
  <text x="76" y="697" class="t" style="fill:#800000;font-weight:600">copied into the lake</text>

  <!-- ===== BRONZE ===== -->
  <rect x="340" y="120" width="340" height="600" rx="18" fill="#f6e3cf" stroke="#d9a873"/>
  <text x="364" y="150" class="tag" style="fill:#8a4b14">LAYER 1</text>
  <text x="364" y="178" class="h" style="fill:#8a4b14">Bronze — raw data</text>
  <image href="icons/aws/AmazonSimpleStorageService.svg" x="610" y="140" width="48" height="48"/>
  <text x="364" y="206" class="t">Write once. Never update. Same shape as the source.</text>

  <rect x="364" y="222" width="292" height="300" rx="12" fill="#fff"/>
  <text x="380" y="248" class="tb">s3://jinder-lake/bronze/</text>
  <text x="380" y="274" class="mono">oltp/&lt;table&gt;/ingest_date=…</text>
  <text x="392" y="292" class="m">Parquet · keep 13 months</text>
  <text x="380" y="320" class="mono">events/event_date=…/type=…</text>
  <text x="392" y="338" class="m">JSON → Parquet · 13 months</text>
  <text x="380" y="366" class="mono">email_events/…</text>
  <text x="392" y="384" class="m">JSON · 6 months</text>
  <text x="380" y="412" class="mono">reference/taxonomy/version=…</text>
  <text x="392" y="430" class="m">JSON · keep all versions</text>
  <text x="380" y="458" class="mono" style="fill:#800000">restricted/parses/…</text>
  <text x="392" y="476" class="m" style="fill:#800000">own KMS key · own access list</text>
  <text x="392" y="492" class="m" style="fill:#800000">delete after 30 days</text>

  <text x="364" y="552" class="tb" style="fill:#8a4b14">Why</text>
  <text x="364" y="572" class="t">Full history and replay. If a Silver</text>
  <text x="364" y="590" class="t">rule is wrong, build Silver again</text>
  <text x="364" y="608" class="t">from Bronze.</text>
  <text x="364" y="640" class="tb" style="fill:#8a4b14">Who can read</text>
  <text x="364" y="660" class="t">Only the data platform role.</text>

  <!-- ===== SILVER ===== -->
  <rect x="760" y="120" width="380" height="600" rx="18" fill="#eef1f5" stroke="#aab4c3"/>
  <text x="784" y="150" class="tag" style="fill:#3b4554">LAYER 2</text>
  <text x="784" y="178" class="h" style="fill:#3b4554">Silver — clean and conformed</text>
  <rect x="784" y="190" width="104" height="22" rx="11" fill="#dbe7f7"/>
  <text x="836" y="205" class="m" style="fill:#1f4e8c;font-weight:600;text-anchor:middle">Apache Iceberg</text>
  <text x="898" y="206" class="m">SCD2 · deduplicated · typed</text>

  <rect x="784" y="222" width="332" height="250" rx="12" fill="#fff"/>
  <text x="800" y="246" class="tb">Dimensions (history kept)</text>
  <text x="800" y="268" class="mono">dim_talent</text><text x="920" y="268" class="m">pseudonymous key, level, years</text>
  <text x="800" y="288" class="mono">dim_employer</text><text x="920" y="288" class="m">company, plan</text>
  <text x="800" y="308" class="mono">dim_job</text><text x="920" y="308" class="m">every edit kept</text>
  <text x="800" y="328" class="mono">dim_skill</text><text x="920" y="328" class="m">from the taxonomy</text>
  <text x="800" y="356" class="tb">Facts and bridges</text>
  <text x="800" y="378" class="mono">fct_application</text>
  <text x="800" y="398" class="mono">fct_status_change</text>
  <text x="800" y="418" class="mono">fct_event · fct_notification</text>
  <text x="800" y="438" class="mono">bridge_talent_skill</text><text x="980" y="438" class="m">accepted only</text>
  <text x="800" y="458" class="mono">bridge_job_skill</text>

  <rect x="784" y="486" width="332" height="96" rx="12" fill="#fff" stroke="#800000" stroke-dasharray="5 4"/>
  <image href="icons/aws/AWSLakeFormation.svg" x="798" y="500" width="36" height="36"/>
  <text x="846" y="514" class="mono" style="fill:#800000">pii_vault</text>
  <text x="846" y="532" class="m">user id ↔ name, email · column rules</text>
  <text x="800" y="556" class="m">Only for erasure and support. A "delete my</text>
  <text x="800" y="572" class="m">data" request removes the person everywhere.</text>

  <text x="784" y="610" class="tb" style="fill:#3b4554">Quality checks (stop the publish)</text>
  <text x="784" y="630" class="t">unique keys · not null · values in the</text>
  <text x="784" y="648" class="t">taxonomy · valid status · references</text>
  <text x="784" y="676" class="tb" style="fill:#3b4554">Fixes gaps</text>
  <text x="784" y="696" class="t">versioned profile · job change history</text>

  <!-- ===== GOLD ===== -->
  <rect x="1220" y="120" width="340" height="600" rx="18" fill="#fdf2c8" stroke="#d6b44a"/>
  <text x="1244" y="150" class="tag" style="fill:#7a5c00">LAYER 3</text>
  <text x="1244" y="178" class="h" style="fill:#7a5c00">Gold — ready to use</text>
  <text x="1244" y="206" class="t">Aggregates for charts, reports, analytics.</text>

  <rect x="1244" y="222" width="292" height="300" rx="12" fill="#fff"/>
  <text x="1260" y="248" class="mono">gold_employer_pipeline_daily</text>
  <text x="1272" y="265" class="m">pipeline by stage</text>
  <text x="1260" y="290" class="mono">gold_job_interest_daily</text>
  <text x="1272" y="307" class="m">shown, opened, saved, applied</text>
  <text x="1260" y="332" class="mono">gold_employer_kpis</text>
  <text x="1272" y="349" class="m">open jobs, at target, waiting</text>
  <text x="1260" y="374" class="mono">gold_talent_profile_counts</text>
  <text x="1272" y="391" class="m">owner only</text>
  <text x="1260" y="416" class="mono">gold_skill_demand_weekly</text>
  <text x="1272" y="433" class="m">skills to learn next</text>
  <text x="1260" y="458" class="mono">gold_product_funnel</text>
  <text x="1272" y="475" class="m">team analytics</text>
  <text x="1260" y="500" class="mono">gold_match_quality</text>
  <text x="1272" y="517" class="m">reports, skips → better ranking</text>

  <rect x="1244" y="538" width="292" height="70" rx="12" fill="#daf9d4"/>
  <text x="1260" y="562" class="tb" style="fill:#005900">No personal data</text>
  <text x="1260" y="582" class="m" style="fill:#005900">A count for the other side shows only</text>
  <text x="1260" y="598" class="m" style="fill:#005900">when it is 5 or more. No demographics.</text>

  <text x="1244" y="640" class="tb" style="fill:#7a5c00">Refresh</text>
  <text x="1244" y="660" class="t">Hourly or daily (EventBridge Scheduler</text>
  <text x="1244" y="678" class="t">→ Step Functions).</text>

  <!-- ===== Arrows between layers ===== -->
  <line x1="300" y1="420" x2="336" y2="420" stroke="#6868f7" stroke-width="3" marker-end="url(#a)"/>

  <line x1="680" y1="420" x2="756" y2="420" stroke="#6868f7" stroke-width="3" marker-end="url(#a)"/>
  <rect x="684" y="436" width="72" height="92" rx="10" fill="#fff" stroke="#e9ecef"/>
  <image href="icons/aws/AWSGlue.svg" x="700" y="444" width="40" height="40"/>
  <text x="720" y="500" class="lbl">Glue</text>
  <text x="720" y="516" class="cap">PySpark</text>
  <text x="718" y="408" class="m" style="text-anchor:middle">MERGE</text>

  <line x1="1140" y1="420" x2="1216" y2="420" stroke="#6868f7" stroke-width="3" marker-end="url(#a)"/>
  <rect x="1144" y="436" width="72" height="120" rx="10" fill="#fff" stroke="#e9ecef"/>
  <image href="icons/tools/dbt.svg" x="1162" y="444" width="36" height="36"/>
  <text x="1180" y="496" class="lbl">dbt</text>
  <image href="icons/aws/AmazonAthena.svg" x="1164" y="504" width="32" height="32"/>
  <text x="1180" y="550" class="cap">on Athena</text>
  <text x="1178" y="408" class="m" style="text-anchor:middle">SQL + tests</text>

  <!-- ===== Serving ===== -->
  <rect x="40" y="760" width="1520" height="150" rx="18" fill="#fff" stroke="#e9ecef" filter="url(#s)"/>
  <text x="62" y="790" class="tag" style="fill:#6868f7">SERVING (FROM GOLD)</text>

  <image href="icons/aws/AWSLambda.svg" x="70" y="810" width="44" height="44"/>
  <text x="92" y="872" class="lbl">Reverse ETL</text><text x="92" y="887" class="cap">after each run</text>
  <line x1="130" y1="832" x2="196" y2="832" stroke="#6868f7" stroke-width="2.2" marker-end="url(#a)"/>
  <image href="icons/aws/AmazonRDS.svg" x="204" y="810" width="44" height="44"/>
  <text x="226" y="872" class="lbl">RDS "analytics"</text><text x="226" y="887" class="cap">read-only schema</text>
  <line x1="262" y1="832" x2="328" y2="832" stroke="#6868f7" stroke-width="2.2" marker-end="url(#a)"/>
  <rect x="336" y="808" width="300" height="50" rx="12" fill="#f0f0fe"/>
  <text x="352" y="830" class="tb">App charts — GET /api/stats</text>
  <text x="352" y="848" class="m">employer Home, talent insights · fast reads</text>

  <image href="icons/aws/AmazonAthena.svg" x="720" y="810" width="44" height="44"/>
  <text x="742" y="872" class="lbl">Athena</text><text x="742" y="887" class="cap">SQL on Gold</text>
  <line x1="778" y1="832" x2="844" y2="832" stroke="#6868f7" stroke-width="2.2" marker-end="url(#a)"/>
  <image href="icons/aws/AmazonQuickSuite.svg" x="852" y="810" width="44" height="44"/>
  <text x="874" y="872" class="lbl">QuickSight</text><text x="874" y="887" class="cap">team dashboards</text>

  <rect x="980" y="808" width="560" height="78" rx="12" fill="#f8f9fa"/>
  <text x="996" y="832" class="tb">Governance for all layers</text>
  <image href="icons/aws/AWSGlue.svg" x="996" y="842" width="30" height="30"/>
  <text x="1032" y="862" class="m">Data Catalog</text>
  <image href="icons/aws/AWSLakeFormation.svg" x="1118" y="842" width="30" height="30"/>
  <text x="1154" y="862" class="m">access rules</text>
  <image href="icons/aws/AWSKeyManagementService.svg" x="1236" y="842" width="30" height="30"/>
  <text x="1272" y="862" class="m">encryption</text>
  <image href="icons/aws/AmazonCloudWatch.svg" x="1354" y="842" width="30" height="30"/>
  <text x="1390" y="862" class="m">job alarms</text>

  <!-- ===== Bottom line ===== -->
  <rect x="40" y="930" width="1520" height="100" rx="16" fill="#f0f0fe"/>
  <text x="64" y="962" class="t"><tspan class="tb">Direction:</tspan> RDS + events → Bronze (raw) → Glue → Silver (clean, personal data split) → dbt → Gold (aggregates) → app charts and dashboards.</text>
  <text x="64" y="986" class="t"><tspan class="tb">Rule:</tspan> the app database stays the source of truth. The lake is for history, analytics and charts. Scores are not stored in any layer.</text>
  <text x="64" y="1010" class="t"><tspan class="tb">Tools:</tspan> AWS Glue (Bronze → Silver), dbt Core on Athena (Silver → Gold), Step Functions + EventBridge Scheduler (orchestration), Iceberg on S3 (tables).</text>
</svg>
