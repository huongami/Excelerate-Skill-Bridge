  <!-- Title -->
  <text x="60" y="70" class="title">Jinder platform — backend: one request, end to end</text>
  <text x="60" y="100" class="sub">jinder_platform/jinder · Python standard library only · port 8095 · every API path starts with /api (no version prefix)</text>

  <!-- ============ ROW 1: client → HTTP server → dispatch · guards ============ -->
  <!-- Client -->
  <rect x="60" y="140" width="220" height="300" rx="18" fill="#fff" stroke="#e9ecef" filter="url(#s)"/>
  <text x="82" y="170" class="tag" style="fill:#6868f7">CLIENT</text>
  <text x="82" y="196" class="h">Browser</text>
  <rect x="82" y="212" width="176" height="52" rx="12" fill="#f9e2fb"/>
  <text x="98" y="236" class="b" style="fill:#560059;font-size:14px">Talent</text>
  <text x="98" y="254" class="m" style="fill:#560059">role = candidate</text>
  <rect x="82" y="274" width="176" height="52" rx="12" fill="#c9f0ff"/>
  <text x="98" y="298" class="b" style="fill:#003d5a;font-size:14px">Employer</text>
  <text x="98" y="316" class="m" style="fill:#003d5a">role = recruiter</text>
  <text x="82" y="354" class="s">jinder_frontend/app</text>
  <text x="82" y="376" class="m">Header on each API call:</text>
  <text x="82" y="396" class="code">Authorization:</text>
  <text x="82" y="414" class="code">Bearer &lt;token&gt;</text>

  <!-- HTTP server -->
  <rect x="320" y="140" width="360" height="300" rx="18" fill="#fff" stroke="#e9ecef" filter="url(#s)"/>
  <text x="342" y="170" class="tag" style="fill:#6868f7">HTTP SERVER · http_server.py</text>
  <text x="342" y="196" class="h">JinderServer (ThreadingHTTPServer)</text>
  <text x="342" y="222" class="t">One thread for each request (daemon)</text>
  <text x="342" y="244" class="t">Idle connection closes after 30 s</text>
  <text x="342" y="266" class="t">Path <tspan class="b">/api/*</tspan> → API dispatch</text>
  <text x="342" y="288" class="t">Other paths → static frontend files</text>
  <rect x="342" y="304" width="316" height="114" rx="12" fill="#f0f0fe"/>
  <text x="358" y="328" class="lbl">Body limits</text>
  <text x="358" y="350" class="s">JSON body 1 MB · multipart body 25 MB</text>
  <text x="358" y="370" class="s">One CV or job file 10 MB (PDF, DOCX)</text>
  <text x="358" y="390" class="s">Upload with no token → 401 before</text>
  <text x="358" y="408" class="s">the server reads the body</text>

  <!-- API dispatch -->
  <rect x="720" y="140" width="400" height="300" rx="18" fill="#fff" stroke="#e9ecef" filter="url(#s)"/>
  <text x="742" y="170" class="tag" style="fill:#6868f7">API DISPATCH · http_server.py</text>
  <text x="742" y="196" class="h">find_route(method, path) → handler(ctx)</text>
  <text x="742" y="222" class="t">Regex routes, checked in registration order</text>
  <text x="742" y="244" class="t">Ctx: body, files, token, IP, own DB connection</text>
  <text x="742" y="266" class="t">Write verbs: BEGIN IMMEDIATE … COMMIT</text>
  <text x="742" y="288" class="t">Error → ROLLBACK · after_commit tasks run</text>
  <text x="742" y="310" class="t">tx=False: hash first, then own transaction</text>
  <rect x="742" y="326" width="356" height="92" rx="12" fill="#f8f9fa"/>
  <text x="758" y="350" class="lbl">Answers (JSON)</text>
  <text x="758" y="372" class="s">{"error": {"code", "message"}} · no stack trace</text>
  <text x="758" y="392" class="s">404 NOT_FOUND · 413 TOO_LARGE</text>
  <text x="758" y="410" class="s">503 BUSY (database lock) · 500 INTERNAL</text>

  <!-- Guards -->
  <rect x="1160" y="140" width="380" height="300" rx="18" fill="#fff" stroke="#e9ecef" filter="url(#s)"/>
  <text x="1182" y="170" class="tag" style="fill:#6868f7">GUARDS · guards.py · store.py</text>
  <text x="1182" y="196" class="h">Checks inside each handler</text>
  <text x="1182" y="222" class="t"><tspan class="b">require_user</tspan> → 401 UNAUTHORIZED</text>
  <text x="1182" y="244" class="t"><tspan class="b">require_role</tspan> → 403 FORBIDDEN</text>
  <text x="1182" y="266" class="t"><tspan class="b">require_premium</tspan> → 403 PREMIUM_REQUIRED</text>
  <rect x="1182" y="284" width="336" height="134" rx="12" fill="#f0f0fe"/>
  <text x="1198" y="308" class="lbl">Session lookup</text>
  <text x="1198" y="330" class="s">store.user_for_token(): SHA-256 of the token</text>
  <text x="1198" y="350" class="s">is looked up in the sessions table</text>
  <text x="1198" y="370" class="s">An expired session is deleted</text>
  <text x="1198" y="390" class="s">The user row is cached for the request</text>
  <text x="1198" y="408" class="s">No cookies: the token is a header</text>

  <text x="82" y="520" class="tag" style="fill:#6868f7">STATIC FILES</text>
  <text x="82" y="546" class="h">jinder_frontend/app</text>
  <text x="82" y="572" class="t">GET and HEAD only (else 405)</text>
  <text x="82" y="594" class="t">Allowed types: html, css, js,</text>
  <text x="82" y="616" class="t">svg, png, jpg, ico, json</text>
  <text x="82" y="638" class="t">Path must stay in the folder</text>
  <text x="82" y="660" class="t">(no path traversal) · else 404</text>
  <text x="82" y="682" class="t">Content-Security-Policy header</text>
  <text x="82" y="704" class="t">Cache-Control: no-cache</text>
  <text x="82" y="740" class="m">The folder is set by JINDER_APP_DIR</text>
  <text x="82" y="760" class="m">var/uploads is never served</text>

  <!-- ============ ROW 3: store/db · SQLite · domain modules · engine ============ -->
  <rect x="60" y="850" width="380" height="220" rx="18" fill="#fff" stroke="#e9ecef" filter="url(#s)"/>
  <text x="82" y="880" class="tag" style="fill:#6868f7">DATA ACCESS · store.py · db.py</text>
  <text x="82" y="906" class="h">Queries and rules</text>
  <text x="82" y="932" class="t">store.py: users, profiles, shared_profile(),</text>
  <text x="82" y="954" class="t">notify(), plans and Premium flags</text>
  <text x="82" y="976" class="t">db.py: one connection for each request</text>
  <text x="82" y="998" class="t">foreign_keys ON · busy_timeout 8 s</text>
  <text x="82" y="1020" class="t">schema.sql · schema version 2</text>
  <text x="82" y="1048" class="m">Old version 1 file is renamed to .v1.bak</text>

  <rect x="480" y="850" width="300" height="220" rx="18" fill="#daf9d4"/>
  <text x="502" y="880" class="tag" style="fill:#005900">DATABASE · SQLITE</text>
  <text x="502" y="906" class="h" style="fill:#005900">var/jinder.db</text>
  <text x="502" y="932" class="t" style="fill:#005900">journal_mode = WAL</text>
  <text x="502" y="954" class="t" style="fill:#005900">22 tables (schema.sql)</text>
  <text x="502" y="976" class="t" style="fill:#005900">Many readers, one writer</text>
  <text x="502" y="998" class="t" style="fill:#005900">Writes: BEGIN IMMEDIATE</text>
  <text x="502" y="1020" class="t" style="fill:#005900">Path set by JINDER_DB_PATH</text>
  <text x="502" y="1048" class="m" style="fill:#005900">seed.py fills the catalogue at start</text>

  <rect x="820" y="850" width="300" height="220" rx="18" fill="#fff" stroke="#e9ecef" filter="url(#s)"/>

  <text x="842" y="998" class="t">aliases.py · reference.py</text>
  <text x="842" y="1020" class="t">util.py: ApiError, ids, dates</text>
  <text x="842" y="1048" class="m">No module has its own HTTP code</text>

  <text x="1182" y="954" class="t">Folder set by JINDER_ENGINE_DIR</text>
  <text x="1182" y="976" class="t">Builds talent and job dictionaries:</text>
  <text x="1182" y="998" class="t">no name, email, country or visa</text>

  <!-- ============ ROW 4: background work ============ -->
  <text x="60" y="1112" class="tag" style="fill:#6868f7">BACKGROUND WORK · STARTED BY app.py</text>

  <rect x="60" y="1130" width="320" height="210" rx="18" fill="#fff5c7"/>
  <text x="82" y="1160" class="tag" style="fill:#a68716">PRIVATE FILES</text>
  <text x="82" y="1186" class="h">var/uploads/</text>
  <text x="82" y="1212" class="t">From POST /cv and</text>
  <text x="82" y="1234" class="t">POST /recruiter/jobs/import</text>
  <text x="82" y="1256" class="t">Server makes the file name</text>
  <text x="82" y="1278" class="t">Mode 600 · never served</text>
  <text x="82" y="1300" class="t">Job file deleted after reading</text>
  <text x="82" y="1324" class="m">Start: unused files older than 1 day go</text>

  <rect x="420" y="1130" width="380" height="210" rx="18" fill="#fff" stroke="#e9ecef" filter="url(#s)"/>
  <text x="442" y="1160" class="tag" style="fill:#6868f7">PARSE POOL · parsing.py</text>
  <text x="442" y="1186" class="h">ThreadPoolExecutor · 2 workers</text>
  <text x="442" y="1212" class="t">Starts after COMMIT (after_commit task)</text>
  <text x="442" y="1234" class="t">textextract.py → cv_parser.py or jd_parser.py</text>
  <text x="442" y="1256" class="t">parses.status: parsing → done or failed</text>
  <text x="442" y="1278" class="t">The upload answers at once (status parsing)</text>
  <text x="442" y="1300" class="t">The browser polls GET /cv/parse/:id</text>
  <text x="442" y="1324" class="m">At start, a stopped parse is marked failed</text>

  <rect x="840" y="1130" width="340" height="210" rx="18" fill="#fff" stroke="#e9ecef" filter="url(#s)"/>
  <text x="862" y="1160" class="tag" style="fill:#6868f7">EMAIL OUTBOX · mailer.py</text>
  <text x="862" y="1186" class="h">Thread jinder-outbox · every 20 s</text>
  <text x="862" y="1212" class="t">Up to 20 due rows from email_outbox</text>
  <text x="862" y="1234" class="t">SMTP with STARTTLS, if JINDER_SMTP_HOST</text>
  <text x="862" y="1256" class="t">No SMTP host → status recorded</text>
  <text x="862" y="1278" class="t">Failure: retry after 2^n minutes</text>
  <text x="862" y="1300" class="t">After 5 tries → status failed</text>
  <text x="862" y="1324" class="m">store.notify(email=True) writes the row</text>

  <rect x="84" y="1432" width="346" height="196" rx="14" fill="#f0f0fe"/>
  <text x="100" y="1458" class="lbl">Sign-in rate limits (in memory)</text>
  <text x="100" y="1482" class="s">Address + email: 5 failures in 15 min</text>
  <text x="100" y="1502" class="s">Address: 20 failures in 15 min</text>
  <text x="100" y="1522" class="s">Email: 30 failures in 15 min</text>
  <text x="100" y="1542" class="s">Own password check: 5 in 15 min</text>
  <text x="100" y="1562" class="s">Only failed tries count → 429 RATE_LIMITED</text>
  <text x="100" y="1586" class="m">A deque of failure times for each key</text>
  <text x="100" y="1606" class="m">One process · lost at a restart</text>

  <rect x="446" y="1432" width="346" height="196" rx="14" fill="#f8f9fa"/>
  <text x="462" y="1458" class="lbl">Passwords and sessions</text>
  <text x="462" y="1482" class="s">scrypt N=2^14, r=8, p=1, 16-byte salt</text>
  <text x="462" y="1502" class="s">Constant-time compare (hmac)</text>
  <text x="462" y="1522" class="s">Token: secrets.token_urlsafe(32)</text>
  <text x="462" y="1542" class="s">The database keeps only SHA-256</text>
  <text x="462" y="1562" class="s">Session 8 h · 30 days with remember</text>
  <text x="462" y="1586" class="m">A password change ends the other</text>
  <text x="462" y="1606" class="m">sessions of the user</text>

  <rect x="808" y="1432" width="346" height="196" rx="14" fill="#c9f0ff"/>
  <text x="824" y="1458" class="lbl" style="fill:#003d5a">Response headers</text>
  <text x="824" y="1482" class="s">All: X-Content-Type-Options nosniff,</text>
  <text x="824" y="1502" class="s">X-Frame-Options DENY, Referrer-Policy,</text>
  <text x="824" y="1522" class="s">Permissions-Policy</text>
  <text x="824" y="1542" class="s">Static files: Content-Security-Policy</text>
  <text x="824" y="1562" class="s">API JSON: Cache-Control no-store</text>
  <text x="824" y="1586" class="m" style="fill:#003d5a">CORS only for JINDER_CORS_ORIGINS</text>
  <text x="824" y="1606" class="m" style="fill:#003d5a">(empty by default)</text>

  <text x="1186" y="1482" class="s" style="fill:#800000">/admin/* has no session or role check</text>
  <text x="1186" y="1502" class="s" style="fill:#800000">A caller can read every table and</text>
