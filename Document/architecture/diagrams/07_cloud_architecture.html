  <rect x="40" y="960" width="1520" height="130" rx="16" fill="#f0f0fe"/>
  <text x="64" y="992" class="t"><tspan class="b">Request path:</tspan> browser → CloudFront (+ WAF) → static files from S3, or /api/* → ALB → API containers → RDS PostgreSQL.</text>
  <text x="64" y="1016" class="t"><tspan class="b">Slow work:</tspan> the API puts jobs on SQS; the worker reads CVs and job descriptions from S3, calls Bedrock (rule-based fallback), sends email with SES.</text>
  <text x="64" y="1040" class="t"><tspan class="b">Privacy:</tspan> CV files never leave the private S3 bucket; employers get only the shared-profile allowlist; personal data is split from analytics in the lake.</text>
  <text x="64" y="1064" class="t"><tspan class="b">Today → target:</tspan> SQLite → RDS PostgreSQL · var/uploads → S3 · threads → SQS + worker · SMTP → SES · rules → Bedrock + rules · HTTP → HTTPS.</text>
